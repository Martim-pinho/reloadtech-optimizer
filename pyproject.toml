[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reloadtech-optimizer"
version = "1.0.0"
description = "Diagnóstico e otimização de computadores Windows, macOS e Linux — ferramenta interna da ReloadTech"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Martim Pinho" }]
keywords = ["diagnóstico", "otimização", "manutenção", "sysadmin", "servidores"]
classifiers = [
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
# Num servidor não se instala isto: a interface gráfica não serve por SSH.
gui = ["PySide6>=6.6"]
pdf = ["reportlab>=4.0"]
completo = ["PySide6>=6.6", "reportlab>=4.0"]

[project.scripts]
reloadtech = "reloadtech.cli:main"

[project.urls]
Repository = "https://github.com/Martim-pinho/reloadtech-optimizer"

[tool.setuptools.packages.find]
include = ["reloadtech*"]

[tool.ruff]
line-length = 110
target-version = "py310"
